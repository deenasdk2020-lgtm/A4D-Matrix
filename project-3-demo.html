<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart Restaurant POS project demo.">
  <title>Smart Restaurant POS — Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0b0d0d;
      --surface: #151919;
      --muted: rgba(236, 244, 239, 0.62);
      --text: #eef5f0;
      --accent: #d9f1dd;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 76px 24px 32px;
      overflow-x: hidden;
      background: radial-gradient(circle at 50% 30%, #1d2925 0, var(--page) 48%, #070808 100%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    .back-link {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 5;
      padding: 9px 12px;
      border: 1px solid rgba(238, 245, 240, 0.16);
      border-radius: 999px;
      background: rgba(11, 13, 13, 0.62);
      color: rgba(238, 245, 240, 0.84);
      font-family: Arial, sans-serif;
      font-size: 12px;
      text-decoration: none;
      backdrop-filter: blur(10px);
      transition: border-color 180ms ease, color 180ms ease, background 180ms ease;
    }

    .back-link:hover,
    .back-link:focus-visible {
      border-color: rgba(217, 241, 221, 0.52);
      background: rgba(22, 31, 28, 0.8);
      color: var(--accent);
      outline: none;
    }

    .demo-shell {
      width: min(100%, 900px);
      display: grid;
      justify-items: center;
      gap: 20px;
      text-align: center;
    }

    .demo-kicker {
      margin: 0;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 54px);
      font-weight: 400;
      letter-spacing: -0.04em;
    }

    .phone {
      width: min(74vw, 320px);
      aspect-ratio: 9 / 19.5;
      padding: 10px;
      position: relative;
      border: 1px solid rgba(238, 245, 240, 0.3);
      border-radius: 40px;
      background: linear-gradient(145deg, #3c4944, #101413 30%, #050606 75%);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.48), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 16px;
      left: 50%;
      z-index: 2;
      width: 30%;
      height: 22px;
      border-radius: 999px;
      background: #050606;
      transform: translateX(-50%);
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      display: block;
      overflow: hidden;
      border-radius: 31px;
      background: #000;
    }

    .phone-screen video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .demo-note {
      margin: 0;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      body {
        padding: 74px 16px 24px;
      }

      .back-link {
        top: 16px;
        left: 16px;
      }

      .phone {
        width: min(78vw, 300px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .back-link {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html#work" id="backToPortfolio">← Back to Portfolio</a>

  <main class="demo-shell">
    <p class="demo-kicker">Project 03 — Product Demo</p>
    <h1>Smart Restaurant POS</h1>
    <div class="phone" aria-label="Smart Restaurant POS mobile app demo">
      <div class="phone-screen">
        <video autoplay muted loop playsinline controls preload="auto" aria-label="Smart Restaurant POS demo video">
          <source src="assets/images/work/project 3 - Demo.mp4" type="video/mp4">
          Your browser does not support the demo video.
        </video>
      </div>
    </div>
    <p class="demo-note">A focused look at the mobile experience.</p>
  </main>
</body>
</html>
